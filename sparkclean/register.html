<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a SparkClean account to book cleaning services and manage your appointments easily.">
  <title>Register — SparkClean Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <nav class="navbar">
      <a href="index.html" class="logo">
        <div class="logo-icon">✨</div>
        Spark<span>Clean</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
        <div class="nav-cta">
          <a href="booking.html" class="btn btn-primary">Book Now</a>
        </div>
      </div>
      <button class="mobile-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <!-- Register Form -->
  <div class="auth-page page-transition">
    <div class="auth-card" style="max-width:480px;">
      <div class="auth-logo">
        <a href="index.html" class="logo" style="justify-content:center;">
          <div class="logo-icon">✨</div>
          Spark<span>Clean</span>
        </a>
      </div>
      <h2>Create Account</h2>
      <p>Join SparkClean to book and manage your cleaning services.</p>
      
      <form data-validate data-form="register">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="+234 800 000 0000" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required minlength="6">
            <button type="button" class="password-toggle" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;">👁</button>
          </div>
          <small style="color:var(--gray-400);font-size:.8rem;">Must be at least 6 characters</small>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div style="position:relative;">
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm your password" required>
            <button type="button" class="password-toggle" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;">👁</button>
          </div>
        </div>
        <div style="margin-bottom:1.5rem;">
          <label style="display:flex;align-items:flex-start;gap:.5rem;cursor:pointer;font-size:.85rem;color:var(--gray-600);">
            <input type="checkbox" required style="accent-color:var(--primary);margin-top:3px;">
            I agree to the <a href="#" style="color:var(--primary);font-weight:600;">Terms of Service</a> and <a href="#" style="color:var(--primary);font-weight:600;">Privacy Policy</a>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
          Create Account →
        </button>
      </form>

      <div class="auth-divider">or sign up with</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.5rem;">
        <button class="btn btn-outline-primary" style="width:100%;" onclick="showToast('Info', 'Social signup coming soon!', 'warning');">🔵 Google</button>
        <button class="btn btn-outline-primary" style="width:100%;" onclick="showToast('Info', 'Social signup coming soon!', 'warning');">⬛ Facebook</button>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
