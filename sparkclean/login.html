<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your SparkClean account to manage bookings and access exclusive features.">
  <title>Login — SparkClean Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <nav class="navbar">
      <a href="index.html" class="logo">
        <div class="logo-icon">✨</div>
        Spark<span>Clean</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
        <a href="login.html" class="active">Login</a>
        <div class="nav-cta">
          <a href="booking.html" class="btn btn-primary">Book Now</a>
        </div>
      </div>
      <button class="mobile-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <!-- Login Form -->
  <div class="auth-page page-transition">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="index.html" class="logo" style="justify-content:center;">
          <div class="logo-icon">✨</div>
          Spark<span>Clean</span>
        </a>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to your account to manage your bookings.</p>
      
      <form data-validate data-form="login">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;">👁</button>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;font-size:.875rem;">
          <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;color:var(--gray-600);margin-bottom:0;">
            <input type="checkbox" style="accent-color:var(--primary);"> Remember me
          </label>
          <a href="#" style="color:var(--primary);font-weight:600;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
          Sign In →
        </button>
      </form>

      <div class="auth-divider">or continue with</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.5rem;">
        <button class="btn btn-outline-primary" style="width:100%;" onclick="showToast('Info', 'Social login coming soon!', 'warning');">🔵 Google</button>
        <button class="btn btn-outline-primary" style="width:100%;" onclick="showToast('Info', 'Social login coming soon!', 'warning');">⬛ Facebook</button>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one here</a>
      </div>

      <div style="margin-top:1.5rem;padding:1rem;background:var(--primary-bg);border-radius:var(--radius);font-size:.85rem;color:var(--gray-600);text-align:center;">
        <strong>Demo Admin Login:</strong><br>
        Email: admin@sparkclean.com<br>
        Password: admin123
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
